[mypy]
python_version = 3.14
strict = true
files = custom_components

# The library ships no py.typed marker yet.
[mypy-pywmswebcontrolpro.*]
ignore_missing_imports = True

# The library model is untyped until the library ships py.typed.
[mypy-ha_wms_webcontrol_pro.cover,custom_components.ha_wms_webcontrol_pro.cover]
warn_return_any = False
